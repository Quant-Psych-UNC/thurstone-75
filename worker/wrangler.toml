name = "thurstone-anniversary-submissions"
main = "worker.mjs"
compatibility_date = "2026-11-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
# The origin only: no repository path and no trailing slash.
SITE_ORIGIN = "https://YOUR-USERNAME.github.io"
GITHUB_OWNER = "YOUR-USERNAME"
GITHUB_REPO = "thurstone-anniversary-data"
GITHUB_BRANCH = "main"
SUBMISSIONS_OPEN = "true"

# Add GITHUB_TOKEN and TURNSTILE_SECRET as secrets, never as vars.
# No bindings to paid storage services are needed.
